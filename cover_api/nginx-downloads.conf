# Include in this site's server block (BaoTa's site extension directory).
location = /config.php { return 404; }
location = /config.example.php { return 404; }
location ^~ /cache/ { return 404; }
location ^~ /src/ { return 404; }
location ^~ /data/ { return 404; }
location ^~ /tests/ { return 404; }
location ^~ /tools/ { return 404; }
location ~ ^/updates/\. { return 404; }
location ~ ^/updates/player-[a-z0-9_-]+\.apk$ {
    types { application/vnd.android.package-archive apk; }
    add_header X-Content-Type-Options nosniff;
    add_header Cache-Control "public, max-age=86400";
}
