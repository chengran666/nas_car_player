# Include in this site's server block (BaoTa's site extension directory).
location ^~ /cache/translation_quota/ { return 404; }
location ^~ /cache/song_selections_v1/ { return 404; }
location ^~ /cache/lyrics_references_v1/ { return 404; }
location ~ ^/updates/\. { return 404; }
location ~ ^/updates/player-[a-z0-9_-]+\.apk$ {
    types { application/vnd.android.package-archive apk; }
    add_header X-Content-Type-Options nosniff;
    add_header Cache-Control "public, max-age=86400";
}
